[package]
name = "rxiv"
version = "0.1.0"
edition = "2024"

[dependencies]
winit = { version = "0.30", default-features = false, features = ["wayland", "x11", "rwh_06"] }
softbuffer = { version = "0.4", default-features = false, features = ["wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico", "pnm", "qoi"] }
toml = "1.0.6"
serde = { version = "1.0.228", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
codegen-units = 1
